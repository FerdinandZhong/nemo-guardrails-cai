name: Deploy NeMo Guardrails to CAI

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild (rerun all jobs)'
        required: false
        default: false
        type: boolean
      enable_local_models:
        description: 'Enable local model support (requires more resources)'
        required: false
        default: false
        type: boolean
      llm_provider:
        description: 'LLM provider (openai, azure, etc.)'
        required: false
        default: 'openai'
        type: string
      llm_model:
        description: 'LLM model name (e.g., gpt-3.5-turbo, gpt-4)'
        required: false
        default: 'gpt-3.5-turbo'
        type: string
      llm_api_base:
        description: 'LLM API base URL (leave empty for default)'
        required: false
        default: ''
        type: string
      llm_api_key:
        description: 'LLM API key (leave empty to use repository secret)'
        required: false
        default: ''
        type: string

jobs:
  setup-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      project_id: ${{ steps.setup.outputs.project_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Setup CAI Project
        id: setup
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Setting up CAI project for NeMo Guardrails..."
          python cai_integration/setup_project.py
          PROJECT_ID=$(cat /tmp/project_id.txt)
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "✅ Project ID: $PROJECT_ID"

      - name: Create job summary
        if: always()
        run: |
          echo "## NeMo Guardrails Setup: Project" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project ID**: ${{ steps.setup.outputs.project_id }}" >> $GITHUB_STEP_SUMMARY

  create-jobs:
    needs: setup-project
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Create CAI Jobs
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
          # LLM configuration - use input or fall back to secret
          OPENAI_API_KEY: ${{ github.event.inputs.llm_api_key || secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'openai' }}
          LLM_MODEL: ${{ github.event.inputs.llm_model || 'gpt-3.5-turbo' }}
          LLM_API_BASE: ${{ github.event.inputs.llm_api_base || '' }}
        run: |
          echo "📋 Creating CAI jobs for NeMo Guardrails..."
          echo "   LLM Provider: $LLM_PROVIDER"
          echo "   LLM Model: $LLM_MODEL"
          echo "   LLM API Base: ${LLM_API_BASE:-'(default)'}"
          python cai_integration/create_jobs.py --project-id ${{ needs.setup-project.outputs.project_id }}
          echo "✅ Jobs created"

      - name: Create job summary
        if: always()
        run: |
          echo "## NeMo Guardrails Setup: Jobs" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project ID**: ${{ needs.setup-project.outputs.project_id }}" >> $GITHUB_STEP_SUMMARY

  trigger-deployment:
    needs: [setup-project, create-jobs]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Trigger Deployment Jobs
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          ENABLE_LOCAL_MODELS: ${{ github.event.inputs.enable_local_models || 'false' }}
        run: |
          echo "🚀 Triggering NeMo Guardrails deployment jobs..."
          python cai_integration/trigger_jobs.py \
            --project-id ${{ needs.setup-project.outputs.project_id }} \
            --jobs-config cai_integration/jobs_config.yaml
          echo "✅ Deployment jobs completed"

      - name: Create deployment summary
        if: always()
        run: |
          echo "## NeMo Guardrails Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Project ID**: ${{ needs.setup-project.outputs.project_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Force Rebuild**: ${{ github.event.inputs.force_rebuild || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Local Models**: ${{ github.event.inputs.enable_local_models || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### LLM Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Provider**: ${{ github.event.inputs.llm_provider || 'openai' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Model**: ${{ github.event.inputs.llm_model || 'gpt-3.5-turbo' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Base**: ${{ github.event.inputs.llm_api_base || '(default)' }}" >> $GITHUB_STEP_SUMMARY

  verify-deployment:
    needs: trigger-deployment
    runs-on: ubuntu-latest
    if: success()
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Verify deployment
        env:
          CML_HOST: ${{ secrets.CML_HOST }}
          CML_API_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          echo "🔍 Verifying NeMo Guardrails deployment..."
          echo "Reading connection info from guardrails_info.json..."
          # Add verification script here
          echo "✅ Deployment verification complete"

      - name: Create verification summary
        if: always()
        run: |
          echo "## Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the CAI project for guardrails_info.json" >> $GITHUB_STEP_SUMMARY
          echo "2. Test the guardrails endpoint" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor logs for any issues" >> $GITHUB_STEP_SUMMARY
